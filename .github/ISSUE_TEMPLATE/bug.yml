name: 🐛 버그
description: 의도와 다르게 동작하는 문제를 알릴 때 사용해요
labels: ['type: bug']
body:
  - type: markdown
    attributes:
      value: |
        제목은 `[MP1] 300자에서 붙여넣기하면 글자가 잘리지 않는 문제`처럼 단계를 앞에 붙여 주세요.
        화면 캡처에 실명·연락처가 보이지 않게 해 주세요.

  - type: textarea
    id: problem
    attributes:
      label: 문제
      description: 어떻게 됐고, 어떻게 돼야 하는지 적어 주세요.
      placeholder: 299자에서 3글자를 붙여넣으면 302자가 입력돼요. 300자에서 멈춰야 해요. (C1)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 환경
      description: 기기 모델 · Android 버전 · 실행한 커밋
      placeholder: Galaxy S23 · Android 15 · a1b2c3d
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: 스크린샷 · 오류 로그
      description: 화면 캡처나 `flutter run` 터미널의 오류 (선택)
