name: 🛠 작업
description: 검증·문서·설정 등 기능·버그 외의 작업에 사용해요
body:
  - type: markdown
    attributes:
      value: |
        제목은 `[MP1] MP1 실기기 검증·캡처·단계 제출물 정리`처럼 단계를 앞에 붙여 주세요.
        라벨은 `type: test` · `type: docs` · `type: setup` 중에서 골라 주세요.

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 무엇을, 왜 하는지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 할 일
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
